<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wills Finance BK — Login</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23C8102E'/%3E%3Cpath d='M50 18 L28 52 L40 52 L28 82 L72 82 L60 52 L72 52 L50 18Z' fill='%23FFB81C'/%3E%3Ccircle cx='50' cy='50' r='14' fill='%23FFFFFF'/%3E%3Cpath d='M50 34 L44 48 L30 48 L42 58 L37 74 L50 64 L63 74 L58 58 L70 48 L56 48 L50 34Z' fill='%23C8102E'/%3E%3C/svg%3E" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com">
    </script>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- Google Fonts: Inter + Playfair Display -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet" />

    <style>
        /* ============================================================
                   PREMIUM STYLES — WILLS FINANCE BK
                ============================================================ */
        :root {
            --wf-red: #C8102E;
            --wf-red-dark: #a00f24;
            --wf-gold: #FFB81C;
            --wf-gold-light: #FFD966;
            --wf-dark: #002856;
            --wf-dark-light: #003b7a;
            --wf-light: #f0f4f8;
            --wf-cream: #faf8f5;
            --wf-text: #1a1a1a;
            --wf-muted: #6b7a8f;
            --wf-shadow: 0 20px 60px rgba(0, 40, 86, 0.10);
            --wf-shadow-hover: 0 30px 80px rgba(0, 40, 86, 0.18);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--wf-light);
            color: var(--wf-text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at 30% 20%, rgba(200, 16, 46, 0.04) 0%, transparent 70%),
                radial-gradient(ellipse at 70% 80%, rgba(255, 184, 28, 0.04) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--wf-light);
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--wf-red), var(--wf-gold));
            border-radius: 10px;
        }

        /* Auth Card */
        .auth-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border-radius: 32px;
            padding: 2.8rem 2.5rem;
            max-width: 440px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 30px 80px rgba(0, 40, 86, 0.08), 0 0 0 1px rgba(255, 255, 255, 0.3);
            position: relative;
            z-index: 1;
            animation: fadeUp 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.97);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .auth-card .auth-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 2rem;
        }
        .auth-card .auth-logo .icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(145deg, var(--wf-red), var(--wf-red-dark));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: var(--wf-gold);
            box-shadow: 0 4px 24px rgba(200, 16, 46, 0.25);
        }
        .auth-card .auth-logo h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--wf-dark);
            margin-top: 10px;
        }
        .auth-card .auth-logo h2 span {
            color: var(--wf-red);
        }
        .auth-card .auth-logo p {
            font-size: 0.8rem;
            color: var(--wf-muted);
            margin-top: 2px;
            letter-spacing: 0.05em;
        }

        .auth-card .form-control {
            border-radius: 12px;
            padding: 0.8rem 1rem;
            border: 1.5px solid rgba(0, 0, 0, 0.06);
            background: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
            transition: all 0.3s ease;
            width: 100%;
            outline: none;
        }
        .auth-card .form-control:focus {
            border-color: var(--wf-red);
            box-shadow: 0 0 0 4px rgba(200, 16, 46, 0.08);
            background: #fff;
        }
        .auth-card .form-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--wf-dark);
            letter-spacing: 0.03em;
            text-transform: uppercase;
            margin-bottom: 4px;
            display: block;
        }
        .auth-card .auth-link {
            color: var(--wf-red);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            transition: color 0.3s ease;
        }
        .auth-card .auth-link:hover {
            color: var(--wf-red-dark);
            text-decoration: underline;
        }
        .auth-card .divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            color: var(--wf-muted);
            font-size: 0.75rem;
            margin: 1.5rem 0;
        }
        .auth-card .divider::before,
        .auth-card .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(0, 0, 0, 0.06);
        }

        .btn-wf-red {
            background: linear-gradient(135deg, var(--wf-red), var(--wf-red-dark));
            color: #fff;
            border: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            border-radius: 9999px;
            padding: 0.7rem 1.5rem;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }
        .btn-wf-red:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 40px rgba(200, 16, 46, 0.40);
            color: #fff;
        }
        .btn-wf-red:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }
        .btn-wf-gold {
            background: linear-gradient(135deg, var(--wf-gold), #e5a50f);
            color: var(--wf-dark);
            border: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 9999px;
            padding: 0.7rem 1.5rem;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }
        .btn-wf-gold:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 40px rgba(255, 184, 28, 0.45);
            color: var(--wf-dark);
        }

        /* Toast */
        .toast-notification {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--wf-dark);
            color: #fff;
            padding: 1rem 1.8rem;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 9998;
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            max-width: 92%;
            width: 440px;
        }
        .toast-notification.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
            pointer-events: auto;
        }
        .toast-notification .toast-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
        }
        .toast-notification .toast-icon.success {
            background: rgba(5, 150, 105, 0.15);
            color: #34d399;
        }
        .toast-notification .toast-icon.error {
            background: rgba(220, 38, 38, 0.15);
            color: #f87171;
        }
        .toast-notification .toast-icon.info {
            background: rgba(255, 184, 28, 0.15);
            color: var(--wf-gold);
        }
        .toast-notification .toast-content .toast-title {
            font-weight: 600;
            font-size: 0.85rem;
        }
        .toast-notification .toast-content .toast-msg {
            font-size: 0.75rem;
            opacity: 0.6;
        }

        /* Shake animation */
        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-8px);
            }
            75% {
                transform: translateX(8px);
            }
        }
        .shake {
            animation: shake 0.4s ease;
        }

        /* Responsive */
        @media (max-width: 576px) {
            .auth-card {
                padding: 1.8rem 1.2rem;
                border-radius: 24px;
            }
            .auth-card .auth-logo h2 {
                font-size: 1.2rem;
            }
            .auth-card .auth-logo .icon {
                width: 46px;
                height: 46px;
                font-size: 1.3rem;
            }
            .toast-notification {
                width: 92%;
                padding: 0.8rem 1.2rem;
                bottom: 16px;
            }
        }

        /* Selection */
        ::selection {
            background: var(--wf-red);
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- ============================================================
    TOAST NOTIFICATION
    ============================================================ -->
    <div class="toast-notification" id="toast">
        <div class="toast-icon success" id="toastIcon"><i class="fas fa-check-circle"></i></div>
        <div class="toast-content">
            <div class="toast-title" id="toastTitle">Success</div>
            <div class="toast-msg" id="toastMsg">Action completed</div>
        </div>
    </div>

    <!-- ============================================================
    LOGIN CARD
    ============================================================ -->
    <div class="auth-card">
        <!-- Logo -->
        <div class="auth-logo">
            <div class="icon"><i class="fas fa-crown"></i></div>
            <h2>WILLS <span>FINANCE</span> BK</h2>
            <p>Welcome back • Sign in to your account</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" autocomplete="off">
            <div class="mb-4">
                <label class="form-label">Email Address</label>
                <input type="email" id="loginEmail" class="form-control" placeholder="admin@wills.com" value="admin@wills.com" required />
            </div>
            <div class="mb-4">
                <label class="form-label">Password</label>
                <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" value="Admin@2026" required />
            </div>
            <div class="flex items-center justify-between mb-4">
                <label class="flex items-center gap-2 text-sm text-wf-muted">
                    <input type="checkbox" id="rememberMe" checked /> Remember me
                </label>
                <a href="#" class="auth-link text-sm" id="forgotLink">Forgot password?</a>
            </div>
            <button type="submit" class="btn-wf-red" id="loginBtn">
                <i class="fas fa-arrow-right"></i> Sign In
            </button>
            <div class="divider">or</div>
            <p class="text-center text-sm text-wf-muted">
                Don't have an account? <a href="signup.html" class="auth-link" id="signupLink">Sign Up</a>
            </p>
        </form>
    </div>

    <!-- ============================================================
    FIREBASE SDK
    ============================================================ -->
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js"
            }
        }
    </script>

    <script type="module">
        // ============================================================
        // IMPORTS
        // ============================================================
        import { initializeApp } from "firebase/app";
        import {
            getAuth,
            signInWithEmailAndPassword,
            onAuthStateChanged,
            sendPasswordResetEmail,
            signOut
        } from "firebase/auth";

        // ============================================================
        // FIREBASE CONFIG (from your admin system)
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyB-ejXt-72-0KJd5cvptzOtdEM10F9a-Z4",
            authDomain: "data-3715b.firebaseapp.com",
            projectId: "data-3715b",
            storageBucket: "data-3715b.firebasestorage.app",
            messagingSenderId: "899957518828",
            appId: "1:899957518828:web:4922e33655b4676244d0c9"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // ============================================================
        // DOM REFS
        // ============================================================
        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('loginEmail');
        const passwordInput = document.getElementById('loginPassword');
        const rememberCheck = document.getElementById('rememberMe');
        const submitBtn = document.getElementById('loginBtn');
        const forgotLink = document.getElementById('forgotLink');
        const signupLink = document.getElementById('signupLink');

        // ============================================================
        // TOAST
        // ============================================================
        let toastTimeout = null;

        function showToast(title, msg, type = 'success') {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toastIcon');
            const titleEl = document.getElementById('toastTitle');
            const msgEl = document.getElementById('toastMsg');

            clearTimeout(toastTimeout);
            titleEl.textContent = title;
            msgEl.textContent = msg;
            icon.className = `toast-icon ${type}`;
            if (type === 'success') icon.innerHTML = '<i class="fas fa-check-circle"></i>';
            else if (type === 'error') icon.innerHTML = '<i class="fas fa-exclamation-circle"></i>';
            else icon.innerHTML = '<i class="fas fa-info-circle"></i>';

            toast.classList.add('show');
            toastTimeout = setTimeout(() => toast.classList.remove('show'), 4500);
        }

        // ============================================================
        // REDIRECT IF ALREADY LOGGED IN
        // ============================================================
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    const tokenResult = await user.getIdTokenResult();
                    if (tokenResult.claims.admin === true) {
                        // User is admin, redirect to dashboard
                        window.location.href = 'dashboard.html';
                    } else {
                        // Non-admin user - show message and sign out
                        showToast('Access Restricted', 'This account does not have admin privileges.', 'info');
                        await signOut(auth);
                    }
                } catch (err) {
                    console.warn('Error checking admin claim:', err);
                }
            }
        });

        // ============================================================
        // LOGIN HANDLER
        // ============================================================
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            if (!email || !password) {
                showToast('Error', 'Please enter both email and password.', 'error');
                form.classList.add('shake');
                setTimeout(() => form.classList.remove('shake'), 500);
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';

            try {
                const userCred = await signInWithEmailAndPassword(auth, email, password);
                const user = userCred.user;

                // Check admin claim
                const tokenResult = await user.getIdTokenResult(true);
                if (tokenResult.claims.admin === true) {
                    showToast('Welcome back!', 'Redirecting to dashboard...', 'success');
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1200);
                } else {
                    showToast('Access Restricted', 'This account is not an administrator.', 'info');
                    await signOut(auth);
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fas fa-arrow-right"></i> Sign In';
                }
            } catch (err) {
                let msg = 'Login failed. Please try again.';
                if (err.code === 'auth/user-not-found') {
                    msg = 'No account found with this email.';
                } else if (err.code === 'auth/wrong-password') {
                    msg = 'Incorrect password. Please try again.';
                } else if (err.code === 'auth/too-many-requests') {
                    msg = 'Too many failed attempts. Please try again later.';
                } else if (err.code === 'auth/invalid-email') {
                    msg = 'Invalid email address format.';
                } else if (err.code === 'auth/user-disabled') {
                    msg = 'This account has been disabled.';
                }
                showToast('Login Failed', msg, 'error');
                form.classList.add('shake');
                setTimeout(() => form.classList.remove('shake'), 500);
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-arrow-right"></i> Sign In';
            }
        });

        // ============================================================
        // FORGOT PASSWORD
        // ============================================================
        forgotLink.addEventListener('click', async (e) => {
            e.preventDefault();
            const email = emailInput.value.trim();
            if (!email) {
                showToast('Error', 'Please enter your email address first.', 'error');
                return;
            }
            try {
                await sendPasswordResetEmail(auth, email);
                showToast('Password Reset Sent', `We've sent a reset link to ${email}`, 'info');
            } catch (err) {
                let msg = 'Could not send reset email.';
                if (err.code === 'auth/user-not-found') {
                    msg = 'No account found with this email.';
                }
                showToast('Reset Failed', msg, 'error');
            }
        });

        // ============================================================
        // SIGNUP LINK - Create a simple signup redirect with instructions
        // ============================================================
        signupLink.addEventListener('click', (e) => {
            e.preventDefault();
            // Since we don't have a signup page, show instructions
            showToast(
                'Admin Registration',
                'To create an admin account, use Firebase Console or contact system administrator.',
                'info'
            );
        });

        // ============================================================
        // PRE-FILL FROM URL PARAMS (optional)
        // ============================================================
        const urlParams = new URLSearchParams(window.location.search);
        const emailParam = urlParams.get('email');
        if (emailParam) {
            emailInput.value = emailParam;
        }

        console.log('🏦 WILLS FINANCE BK — Login Page');
        console.log('🔐 Admin credentials: admin@wills.com / Admin@2026');
        console.log('🔒 Only admin users can access the dashboard.');
        console.log('📝 To create admin users, use Firebase Console or set custom claims.');
    </script>

</body>
</html>
