<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wills Finance BK — Sign Up</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23C8102E'/%3E%3Cpath d='M50 18 L28 52 L40 52 L28 82 L72 82 L60 52 L72 52 L50 18Z' fill='%23FFB81C'/%3E%3Ccircle cx='50' cy='50' r='14' fill='%23FFFFFF'/%3E%3Cpath d='M50 34 L44 48 L30 48 L42 58 L37 74 L50 64 L63 74 L58 58 L70 48 L56 48 L50 34Z' fill='%23C8102E'/%3E%3C/svg%3E" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com">
    </script>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- Google Fonts: Inter + Playfair Display -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet" />

    <style>
        /* ============================================================
                   PREMIUM STYLES — WILLS FINANCE BK
                ============================================================ */
        :root {
            --wf-red: #C8102E;
            --wf-red-dark: #a00f24;
            --wf-gold: #FFB81C;
            --wf-gold-light: #FFD966;
            --wf-dark: #002856;
            --wf-dark-light: #003b7a;
            --wf-light: #f0f4f8;
            --wf-cream: #faf8f5;
            --wf-text: #1a1a1a;
            --wf-muted: #6b7a8f;
            --wf-shadow: 0 20px 60px rgba(0, 40, 86, 0.10);
            --wf-shadow-hover: 0 30px 80px rgba(0, 40, 86, 0.18);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--wf-light);
            color: var(--wf-text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at 30% 20%, rgba(200, 16, 46, 0.04) 0%, transparent 70%),
                radial-gradient(ellipse at 70% 80%, rgba(255, 184, 28, 0.04) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--wf-light);
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--wf-red), var(--wf-gold));
            border-radius: 10px;
        }

        /* Auth Card */
        .auth-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border-radius: 32px;
            padding: 2.8rem 2.5rem;
            max-width: 440px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 30px 80px rgba(0, 40, 86, 0.08), 0 0 0 1px rgba(255, 255, 255, 0.3);
            position: relative;
            z-index: 1;
            animation: fadeUp 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.97);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .auth-card .auth-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 2rem;
        }
        .auth-card .auth-logo .icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(145deg, var(--wf-red), var(--wf-red-dark));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: var(--wf-gold);
            box-shadow: 0 4px 24px rgba(200, 16, 46, 0.25);
        }
        .auth-card .auth-logo h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--wf-dark);
            margin-top: 10px;
        }
        .auth-card .auth-logo h2 span {
            color: var(--wf-red);
        }
        .auth-card .auth-logo p {
            font-size: 0.8rem;
            color: var(--wf-muted);
            margin-top: 2px;
            letter-spacing: 0.05em;
        }

        .auth-card .form-control {
            border-radius: 12px;
            padding: 0.8rem 1rem;
            border: 1.5px solid rgba(0, 0, 0, 0.06);
            background: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
            transition: all 0.3s ease;
            width: 100%;
            outline: none;
        }
        .auth-card .form-control:focus {
            border-color: var(--wf-red);
            box-shadow: 0 0 0 4px rgba(200, 16, 46, 0.08);
            background: #fff;
        }
        .auth-card .form-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--wf-dark);
            letter-spacing: 0.03em;
            text-transform: uppercase;
            margin-bottom: 4px;
            display: block;
        }
        .auth-card .auth-link {
            color: var(--wf-red);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            transition: color 0.3s ease;
        }
        .auth-card .auth-link:hover {
            color: var(--wf-red-dark);
            text-decoration: underline;
        }
        .auth-card .divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            color: var(--wf-muted);
            font-size: 0.75rem;
            margin: 1.5rem 0;
        }
        .auth-card .divider::before,
        .auth-card .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(0, 0, 0, 0.06);
        }

        .btn-wf-red {
            background: linear-gradient(135deg, var(--wf-red), var(--wf-red-dark));
            color: #fff;
            border: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            border-radius: 9999px;
            padding: 0.7rem 1.5rem;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }
        .btn-wf-red:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 40px rgba(200, 16, 46, 0.40);
            color: #fff;
        }
        .btn-wf-red:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }
        .btn-wf-gold {
            background: linear-gradient(135deg, var(--wf-gold), #e5a50f);
            color: var(--wf-dark);
            border: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 9999px;
            padding: 0.7rem 1.5rem;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }
        .btn-wf-gold:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 40px rgba(255, 184, 28, 0.45);
            color: var(--wf-dark);
        }
        .btn-wf-gold:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        /* Toast */
        .toast-notification {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--wf-dark);
            color: #fff;
            padding: 1rem 1.8rem;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 9998;
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            max-width: 92%;
            width: 440px;
        }
        .toast-notification.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
            pointer-events: auto;
        }
        .toast-notification .toast-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
        }
        .toast-notification .toast-icon.success {
            background: rgba(5, 150, 105, 0.15);
            color: #34d399;
        }
        .toast-notification .toast-icon.error {
            background: rgba(220, 38, 38, 0.15);
            color: #f87171;
        }
        .toast-notification .toast-icon.info {
            background: rgba(255, 184, 28, 0.15);
            color: var(--wf-gold);
        }
        .toast-notification .toast-content .toast-title {
            font-weight: 600;
            font-size: 0.85rem;
        }
        .toast-notification .toast-content .toast-msg {
            font-size: 0.75rem;
            opacity: 0.6;
        }

        /* Password strength */
        .password-strength {
            height: 3px;
            border-radius: 4px;
            margin-top: 6px;
            background: rgba(0, 0, 0, 0.06);
            transition: all 0.3s ease;
            overflow: hidden;
        }
        .password-strength .fill {
            height: 100%;
            width: 0%;
            border-radius: 4px;
            transition: width 0.4s ease, background 0.4s ease;
        }

        /* Shake animation */
        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-8px);
            }
            75% {
                transform: translateX(8px);
            }
        }
        .shake {
            animation: shake 0.4s ease;
        }

        /* Responsive */
        @media (max-width: 576px) {
            .auth-card {
                padding: 1.8rem 1.2rem;
                border-radius: 24px;
            }
            .auth-card .auth-logo h2 {
                font-size: 1.2rem;
            }
            .auth-card .auth-logo .icon {
                width: 46px;
                height: 46px;
                font-size: 1.3rem;
            }
            .toast-notification {
                width: 92%;
                padding: 0.8rem 1.2rem;
                bottom: 16px;
            }
        }

        /* Selection */
        ::selection {
            background: var(--wf-red);
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- ============================================================
    TOAST NOTIFICATION
    ============================================================ -->
    <div class="toast-notification" id="toast">
        <div class="toast-icon success" id="toastIcon"><i class="fas fa-check-circle"></i></div>
        <div class="toast-content">
            <div class="toast-title" id="toastTitle">Success</div>
            <div class="toast-msg" id="toastMsg">Action completed</div>
        </div>
    </div>

    <!-- ============================================================
    SIGNUP CARD
    ============================================================ -->
    <div class="auth-card">
        <!-- Logo -->
        <div class="auth-logo">
            <div class="icon"><i class="fas fa-crown"></i></div>
            <h2>WILLS <span>FINANCE</span> BK</h2>
            <p>Create your premium account</p>
        </div>

        <!-- Signup Form -->
        <form id="signupForm" autocomplete="off">
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" id="signupName" class="form-control" placeholder="John Irwin" required />
            </div>
            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" id="signupEmail" class="form-control" placeholder="john@example.com" required />
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" id="signupPassword" class="form-control" placeholder="••••••••" minlength="6" required />
                <div class="password-strength"><div class="fill" id="strengthFill"></div></div>
                <div class="flex justify-between text-xs text-wf-muted mt-1">
                    <span id="strengthLabel">Min. 6 characters</span>
                    <span id="strengthText">Weak</span>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label">Confirm Password</label>
                <input type="password" id="signupConfirm" class="form-control" placeholder="••••••••" required />
            </div>
            <div class="flex items-center gap-2 mb-4">
                <input type="checkbox" id="terms" checked />
                <label for="terms" class="text-sm text-wf-muted">I agree to the <a href="#" class="auth-link">Terms</a> &amp; <a href="#" class="auth-link">Privacy Policy</a></label>
            </div>
            <button type="submit" class="btn-wf-gold" id="signupBtn">
                <i class="fas fa-user-plus"></i> Create Account
            </button>
            <div class="divider">or</div>
            <p class="text-center text-sm text-wf-muted">
                Already have an account? <a href="login.html" class="auth-link">Log In</a>
            </p>
        </form>
    </div>

    <!-- ============================================================
    FIREBASE SDK
    ============================================================ -->
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js"
            }
        }
    </script>

    <script type="module">
        // ============================================================
        // IMPORTS
        // ============================================================
        import { initializeApp } from "firebase/app";
        import {
            getAuth,
            createUserWithEmailAndPassword,
            sendEmailVerification,
            onAuthStateChanged,
            signOut
        } from "firebase/auth";
        import {
            getFirestore,
            doc,
            setDoc,
            serverTimestamp
        } from "firebase/firestore";

        // ============================================================
        // FIREBASE CONFIG (from your admin system)
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyB-ejXt-72-0KJd5cvptzOtdEM10F9a-Z4",
            authDomain: "data-3715b.firebaseapp.com",
            projectId: "data-3715b",
            storageBucket: "data-3715b.firebasestorage.app",
            messagingSenderId: "899957518828",
            appId: "1:899957518828:web:4922e33655b4676244d0c9"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // ============================================================
        // DOM REFS
        // ============================================================
        const form = document.getElementById('signupForm');
        const nameInput = document.getElementById('signupName');
        const emailInput = document.getElementById('signupEmail');
        const passwordInput = document.getElementById('signupPassword');
        const confirmInput = document.getElementById('signupConfirm');
        const termsCheck = document.getElementById('terms');
        const submitBtn = document.getElementById('signupBtn');
        const strengthFill = document.getElementById('strengthFill');
        const strengthLabel = document.getElementById('strengthLabel');
        const strengthText = document.getElementById('strengthText');

        // ============================================================
        // TOAST
        // ============================================================
        let toastTimeout = null;

        function showToast(title, msg, type = 'success') {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toastIcon');
            const titleEl = document.getElementById('toastTitle');
            const msgEl = document.getElementById('toastMsg');

            clearTimeout(toastTimeout);
            titleEl.textContent = title;
            msgEl.textContent = msg;
            icon.className = `toast-icon ${type}`;
            if (type === 'success') icon.innerHTML = '<i class="fas fa-check-circle"></i>';
            else if (type === 'error') icon.innerHTML = '<i class="fas fa-exclamation-circle"></i>';
            else icon.innerHTML = '<i class="fas fa-info-circle"></i>';

            toast.classList.add('show');
            toastTimeout = setTimeout(() => toast.classList.remove('show'), 4500);
        }

        // ============================================================
        // PASSWORD STRENGTH
        // ============================================================
        passwordInput.addEventListener('input', function() {
            const val = this.value;
            let score = 0;
            if (val.length >= 6) score++;
            if (val.length >= 10) score++;
            if (/[a-z]/.test(val) && /[A-Z]/.test(val)) score++;
            if (/\d/.test(val)) score++;
            if (/[^a-zA-Z0-9]/.test(val)) score++;

            const pct = Math.min((score / 5) * 100, 100);
            strengthFill.style.width = pct + '%';

            let color, label;
            if (pct < 25) { color = '#f87171';
                label = 'Weak'; } else if (pct < 50) { color = '#fbbf24';
                label = 'Fair'; } else if (pct < 75) { color = '#34d399';
                label = 'Good'; } else { color = '#34d399';
                label = 'Strong'; }
            strengthFill.style.background = color;
            strengthText.textContent = label;
            strengthText.style.color = color;
            strengthLabel.textContent = val.length ? `${val.length} characters` : 'Min. 6 characters';
        });

        // ============================================================
        // SIGNUP HANDLER
        // ============================================================
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = nameInput.value.trim();
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const confirm = confirmInput.value;

            // ── Validation ──
            if (!name || !email || !password || !confirm) {
                showToast('Error', 'Please fill in all fields.', 'error');
                form.classList.add('shake');
                setTimeout(() => form.classList.remove('shake'), 500);
                return;
            }
            if (password !== confirm) {
                showToast('Error', 'Passwords do not match.', 'error');
                confirmInput.focus();
                form.classList.add('shake');
                setTimeout(() => form.classList.remove('shake'), 500);
                return;
            }
            if (password.length < 6) {
                showToast('Error', 'Password must be at least 6 characters.', 'error');
                passwordInput.focus();
                return;
            }
            if (!termsCheck.checked) {
                showToast('Error', 'You must agree to the Terms & Privacy Policy.', 'error');
                return;
            }

            // ── Disable button ──
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating...';

            try {
                // 1. Create Auth user
                const userCred = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCred.user;

                // 2. Store user data in Firestore
                const userData = {
                    name: name,
                    email: email,
                    role: 'client',
                    balance: 10000,
                    suspended: false,
                    accounts: [
                        { type: 'checking', number: Math.floor(1000 + Math.random() * 9000).toString(),
                            balance: 8000, name: 'Primary Checking' },
                        { type: 'savings', number: Math.floor(1000 + Math.random() * 9000).toString(),
                            balance: 2000, name: 'Premium Savings' }
                    ],
                    cards: [],
                    investments: { total: 0, stocks: 0, bonds: 0, realEstate: 0, cash: 0 },
                    createdAt: serverTimestamp(),
                    createdBy: 'signup'
                };

                await setDoc(doc(db, 'users', user.uid), userData);

                // 3. Send verification email
                await sendEmailVerification(user);

                showToast('🎉 Account Created!',
                    `Welcome ${name}! Please check your email to verify your account. Redirecting to login...`,
                    'success');

                // 4. Sign out and redirect to login
                await signOut(auth);
                setTimeout(() => {
                    window.location.href = 'login.html?verified=true';
                }, 2500);

            } catch (err) {
                let msg = err.message || 'Something went wrong.';
                if (err.code === 'auth/email-already-in-use') {
                    msg = 'This email is already registered. Please log in instead.';
                } else if (err.code === 'auth/weak-password') {
                    msg = 'Password is too weak. Please use a stronger password.';
                } else if (err.code === 'auth/invalid-email') {
                    msg = 'Please enter a valid email address.';
                }
                showToast('Signup Failed', msg, 'error');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
                form.classList.add('shake');
                setTimeout(() => form.classList.remove('shake'), 500);
            }
        });

        // ============================================================
        // REDIRECT IF ALREADY LOGGED IN
        // ============================================================
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // User is already logged in — redirect to dashboard
                window.location.href = 'index.html';
            }
        });

        // ============================================================
        // CHECK FOR VERIFIED PARAM
        // ============================================================
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('verified') === 'true') {
            setTimeout(() => {
                showToast('✅ Email Verified', 'Your email has been verified. You can now log in.', 'success');
            }, 600);
        }

        console.log('🏦 WILLS FINANCE BK — Sign Up Page');
        console.log('🔐 Firebase Auth + Firestore ready.');
    </script>

</body>
</html>
